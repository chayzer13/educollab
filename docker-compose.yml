services:
  postgres:
    image: postgres:15-alpine
    container_name: educollab-db
    environment:
      POSTGRES_USER: educollab
      POSTGRES_PASSWORD: educollab_password
      POSTGRES_DB: educollab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - educollab-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educollab"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: educollab-backend
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: educollab
      DB_PASSWORD: educollab_password
      DB_NAME: educollab
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRES_IN: 7d
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - educollab-network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: educollab-frontend
    environment:
      REACT_APP_API_URL: http://localhost:3001/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - educollab-network
    command: npm start

  nginx:
    image: nginx:alpine
    container_name: educollab-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - backend
      - frontend
    networks:
      - educollab-network

  background-service:
    build:
      context: ./background-service
      dockerfile: Dockerfile
    container_name: educollab-background
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: educollab
      DB_PASSWORD: educollab_password
      DB_NAME: educollab
      API_URL: http://backend:3001/api
    volumes:
      - ./background-service:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - educollab-network
    command: npm start

volumes:
  postgres_data:
  backend_uploads:

networks:
  educollab-network:
    driver: bridge
